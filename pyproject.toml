[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "distributed-workflow-engine"
version = "0.1.0"
description = "A distributed DAG workflow engine with durable task ownership and recovery."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
engine = "workflow_engine.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "pytest>=8.3.5,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
