name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked mypy

      - name: Test
        run: uv run --locked pytest

      - name: Build source distribution and wheel
        run: uv build

  containers:
    name: Container integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: dwe-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize disposable credentials
        run: python3 scripts/init_dev_secrets.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check API and runtime image
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl --fail --silent --show-error http://127.0.0.1:8000/openapi.json | python3 -c 'import json, sys; assert "/health/live" in json.load(sys.stdin)["paths"]'
          docker compose exec -T api python -c 'import importlib.util, os, shutil; assert os.getuid() == 10001; assert importlib.util.find_spec("pytest") is None; assert shutil.which("uv") is None'

      - name: Verify packaged migration resources in the runtime image
        run: |
          docker compose exec -T api alembic heads
          docker compose exec -T api python -c 'from importlib.resources import files; from alembic.config import Config; from alembic.script import ScriptDirectory; assert ScriptDirectory.from_config(Config("alembic.ini")).get_heads() == ["0001"]; assert files("workflow_engine.migrations").joinpath("script.py.mako").is_file()'

      - name: Install uv for database integration tests
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked test dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Test application database connectivity and transactions
        run: |
          cat > .env.database-test <<'ENV'
          DWE_ENVIRONMENT=test
          DWE_DATABASE_HOST=127.0.0.1
          DWE_DATABASE_PORT=5432
          DWE_DATABASE_NAME=workflow
          DWE_DATABASE_USER=workflow_admin
          DWE_DATABASE_PASSWORD_FILE=secrets/postgres_password.txt
          ENV
          uv run --locked engine check-db --env-file .env.database-test
          uv run --locked pytest tests/integration --database-env-file .env.database-test
          uv run --locked alembic -x env_file=.env.database-test upgrade head
          uv run --locked alembic -x env_file=.env.database-test current
          uv run --locked alembic -x env_file=.env.database-test check

      - name: Verify authenticated SQL and write persistence probe
        run: |
          docker compose exec -T postgres sh -eu -c 'export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"; exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' <<'SQL'
          CREATE TABLE infrastructure_probe (id integer PRIMARY KEY);
          INSERT INTO infrastructure_probe VALUES (1);
          SQL

      - name: Recreate database container and verify persisted data
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 120 postgres
          result=$(docker compose exec -T postgres sh -eu -c 'export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"; exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atc "SELECT id FROM infrastructure_probe;"')
          test "$result" = "1"
          docker compose exec -T postgres sh -eu -c 'export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"; exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "DROP TABLE infrastructure_probe;"'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove disposable CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
